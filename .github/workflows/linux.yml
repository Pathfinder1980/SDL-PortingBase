name: Linux

on:
  push:
  pull_request:

# Build-and-test only: the workflow never needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # SDL2 builds from source (FetchContent), so its video/audio backend
      # dev packages must exist before configuring.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libudev-dev libdrm-dev libgbm-dev

      - name: Configure
        run: cmake --preset linux-gcc-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset linux-gcc-${{ matrix.config }}

      - name: Unit tests
        run: ctest --preset linux-gcc-${{ matrix.config }}
