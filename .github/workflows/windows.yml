name: Windows

on:
  push:
  pull_request:

# Build-and-test only: the workflow never needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # Puts cl.exe (and friends) on PATH — the CI equivalent of vcvars64.
      # Third-party action, pinned to a commit SHA so a moved tag can't
      # inject different code into this build.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Configure
        run: cmake --preset windows-msvc-${{ matrix.config }}

      - name: Build
        run: cmake --build --preset windows-msvc-${{ matrix.config }}

      - name: Unit tests
        run: ctest --preset windows-msvc-${{ matrix.config }}

      # No demo run here: hosted Windows runners have no GPU and only expose
      # the GDI software GL 1.1 context, so a 3.3 core context cannot be
      # created. Linux could smoke-test via Mesa's llvmpipe once the app
      # learns a --frames auto-exit flag.
